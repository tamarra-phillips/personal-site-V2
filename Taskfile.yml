version: '3'

tasks:
  docker:run:
    internal: true
    requires:
      vars: [COMMAND]
    vars:
      NODE_IMAGE: node:11.9
      DOCKER_ARGS: ''
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/workspace" -w /workspace {{.NODE_IMAGE}} {{.DOCKER_ARGS}} sh -c "{{.COMMAND}}"

  default:
    desc: List the available tasks
    cmds:
      - task --list

  install:
    desc: Install the locked Node.js dependencies in Docker
    cmds:
      - task: docker:run
        vars:
          COMMAND: npm ci

  dev:
    desc: Build the site, start BrowserSync, and watch for changes
    cmds:
      - task: docker:run
        vars:
          COMMAND: npm ci && npm start
          DOCKER_ARGS: -p 8000:8000

  build:
    desc: Create a production build in dist/
    cmds:
      - task: docker:run
        vars:
          COMMAND: npm ci && npm run build

  verify:
    desc: Verify the generated site entry point exists
    cmds:
      - test -s dist/index.html

  package:
    desc: Build and package the complete dist/ directory
    deps:
      - build
      - verify
    cmds:
      - task: docker:run
        vars:
          COMMAND: tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf dist.tar.gz -C dist .

  clean:
    desc: Remove generated site output
    cmds:
      - rm -rf dist dist.tar.gz

  ci:
    desc: Clean and verify the production build
    cmds:
      - task: clean
      - task: build
