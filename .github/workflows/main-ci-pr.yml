name: Main CI PR

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x

      - name: Build
        run: task build

      - name: Verify generated asset
        run: task verify
